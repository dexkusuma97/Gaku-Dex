name: Deploy DeX Gaku

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Ambil kode
        uses: actions/checkout@v6

      - name: Siapkan Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Siapkan proyek Cloudflare Pages
        shell: python
        run: |
          import os, json, urllib.request, urllib.error

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          base = f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects"
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          def request(url, data=None):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(data).encode() if data else None,
                  headers=headers
              )
              with urllib.request.urlopen(req) as response:
                  result = json.load(response)
              if not result.get("success"):
                  raise RuntimeError(result.get("errors"))
              return result

          try:
              request(base + "/dex-gaku")
              print("Proyek dex-gaku sudah tersedia.")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              request(base, {
                  "name": "dex-gaku",
                  "production_branch": "main"
              })
              print("Proyek dex-gaku berhasil dibuat.")

      - name: Unggah website
        run: npx --yes wrangler@4 pages deploy dist --project-name=dex-gaku --branch=main
