<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 870" role="img" aria-labelledby="bab10-posisi-title bab10-posisi-desc"><title id="bab10-posisi-title">Di mana bendanya?</title><desc id="bab10-posisi-desc">Satu kotak besar dan bola: atas, bawah, dalam, luar, depan, belakang, kanan, kiri, sebelah dan dekat. Panel bawah: bola di antara dua kotak. Depan kotak menghadap pembaca.</desc><defs><marker id="bab10-posisi-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}</style><rect x="0" y="0" width="720" height="870" rx="24" fill="#f0f6f3" stroke="none" stroke-width="3"/><text x="360" y="48" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">Di mana bendanya?</text><text x="360" y="94" font-size="24" fill="#657c73" font-weight="500" text-anchor="middle">Bola merah muda = benda yang dicari</text><circle cx="405" cy="243" r="17" fill="#ce85ac" stroke="#fff" stroke-width="3"/><text x="473" y="224" font-size="27" fill="#30483f" font-weight="500" text-anchor="middle">うしろ</text><text x="485" y="253" font-size="21" fill="#657c73" font-weight="500" text-anchor="middle">belakang</text><path d="M245 282l45-35h186l-45 35z" fill="#f0dfbf" stroke="#bb9b67" stroke-width="3"/><rect x="245" y="282" width="186" height="150" rx="5" fill="#f2dfbd" stroke="#bb9b67" stroke-width="3"/><path d="M431 282l45-35v150l-45 35z" fill="#d6bd94" stroke="#bb9b67" stroke-width="3"/><rect x="275" y="319" width="116" height="79" rx="5" fill="#fff6e6" stroke="#d2b78e" stroke-width="3"/><circle cx="330" cy="356" r="14" fill="#ce85ac" stroke="#fff" stroke-width="3"/><text x="330" y="388" font-size="24" fill="#30483f" font-weight="500" text-anchor="middle">なか</text><text x="344" y="419" font-size="18" fill="#657c73" font-weight="500" text-anchor="middle">正面 · depan kotak</text><circle cx="337" cy="181" r="14" fill="#ce85ac" stroke="#fff" stroke-width="3"/><text x="337" y="131" font-size="27" fill="#30483f" font-weight="700" text-anchor="middle">うえ</text><text x="337" y="159" font-size="21" fill="#657c73" font-weight="500" text-anchor="middle">atas</text><circle cx="337" cy="496" r="14" fill="#ce85ac" stroke="#fff" stroke-width="3"/><text x="337" y="538" font-size="27" fill="#30483f" font-weight="700" text-anchor="middle">した</text><text x="337" y="566" font-size="21" fill="#657c73" font-weight="500" text-anchor="middle">bawah</text><circle cx="188" cy="348" r="14" fill="#ce85ac" stroke="#fff" stroke-width="3"/><text x="100" y="320" font-size="27" fill="#30483f" font-weight="700" text-anchor="middle">ひだり</text><text x="100" y="348" font-size="21" fill="#657c73" font-weight="500" text-anchor="middle">kiri</text><circle cx="532" cy="348" r="14" fill="#ce85ac" stroke="#fff" stroke-width="3"/><text x="600" y="320" font-size="27" fill="#30483f" font-weight="700" text-anchor="middle">みぎ</text><text x="600" y="348" font-size="21" fill="#657c73" font-weight="500" text-anchor="middle">kanan</text><circle cx="338" cy="444" r="14" fill="#ce85ac" stroke="#fff" stroke-width="3"/><text x="208" y="464" font-size="27" fill="#30483f" font-weight="700" text-anchor="middle">まえ</text><text x="208" y="492" font-size="21" fill="#657c73" font-weight="500" text-anchor="middle">depan</text><path d="M226 450L316 444" fill="none" stroke="#ce85ac" stroke-width="2" stroke-linecap="round"/><circle cx="562" cy="178" r="14" fill="#ce85ac" stroke="#fff" stroke-width="3"/><text x="575" y="124" font-size="27" fill="#30483f" font-weight="700" text-anchor="middle">そと</text><text x="575" y="152" font-size="21" fill="#657c73" font-weight="500" text-anchor="middle">luar</text><circle cx="535" cy="431" r="14" fill="#ce85ac" stroke="#fff" stroke-width="3"/><text x="609" y="453" font-size="27" fill="#30483f" font-weight="700" text-anchor="middle">となり</text><text x="609" y="481" font-size="21" fill="#657c73" font-weight="500" text-anchor="middle">sebelah</text><circle cx="557" cy="542" r="14" fill="#ce85ac" stroke="#fff" stroke-width="3"/><text x="586" y="583" font-size="27" fill="#30483f" font-weight="700" text-anchor="middle">ちかく</text><text x="586" y="611" font-size="21" fill="#657c73" font-weight="500" text-anchor="middle">dekat</text><rect x="24" y="623" width="672" height="135" rx="18" fill="#fff" stroke="none" stroke-width="3"/><rect x="155" y="658" width="62" height="54" rx="6" fill="#e6d2ae" stroke="none" stroke-width="3"/><circle cx="360" cy="684" r="16" fill="#ce85ac" stroke="#fff" stroke-width="3"/><rect x="503" y="658" width="62" height="54" rx="6" fill="#e6d2ae" stroke="none" stroke-width="3"/><path d="M229 685L332 685" fill="none" stroke="#bfcfc5" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 9"/><path d="M388 685L490 685" fill="none" stroke="#bfcfc5" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 9"/><text x="360" y="651" font-size="27" fill="#30483f" font-weight="700" text-anchor="middle">あいだ · antara dua benda</text><text x="360" y="802" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">つくえの うえに ほんが あります。</text><text x="360" y="841" font-size="24" fill="#657c73" font-weight="500" text-anchor="middle">Ada buku di atas meja.</text></svg>