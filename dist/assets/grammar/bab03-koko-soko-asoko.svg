<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" role="img" aria-labelledby="bab03-koko-soko-asoko-title bab03-koko-soko-asoko-desc"><title id="bab03-koko-soko-asoko-title">Tempat dilihat dari atas</title><desc id="bab03-koko-soko-asoko-desc">Denah dari atas: saya di kiri, kamu di kanan, titik ここ dekat saya, そこ dekat kamu, あそこ jauh dari keduanya. Versi sopan こちら／そちら／あちら.</desc><defs><marker id="bab03-koko-soko-asoko-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}</style><rect x="0" y="0" width="720" height="590" rx="24" fill="#f0f6f3" stroke="none" stroke-width="3"/><text x="360" y="48" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">Tempat dilihat dari atas</text><rect x="24" y="80" width="672" height="330" rx="18" fill="#fff" stroke="#d4e3da" stroke-width="3"/><circle cx="105" cy="310" r="29" fill="#8a6caf" stroke="#fff" stroke-width="3"/><text x="105" y="369" font-size="23" fill="#30483f" font-weight="500" text-anchor="middle">saya</text><circle cx="615" cy="310" r="29" fill="#438a78" stroke="#fff" stroke-width="3"/><text x="615" y="369" font-size="23" fill="#30483f" font-weight="500" text-anchor="middle">kamu</text><path d="M137 310L170 310" fill="none" stroke="#8a6caf" stroke-width="5" stroke-linecap="round" marker-end="url(#bab03-koko-soko-asoko-arrow)"/><path d="M583 310L550 310" fill="none" stroke="#438a78" stroke-width="5" stroke-linecap="round" marker-end="url(#bab03-koko-soko-asoko-arrow)"/><circle cx="220" cy="288" r="14" fill="#8a6caf" stroke="#fff" stroke-width="3"/><text x="220" y="261" font-size="31" fill="#30483f" font-weight="700" text-anchor="middle">ここ</text><text x="220" y="335" font-size="23" fill="#657c73" font-weight="500" text-anchor="middle">di sini</text><circle cx="500" cy="288" r="14" fill="#438a78" stroke="#fff" stroke-width="3"/><text x="500" y="261" font-size="31" fill="#30483f" font-weight="700" text-anchor="middle">そこ</text><text x="500" y="335" font-size="23" fill="#657c73" font-weight="500" text-anchor="middle">di situ</text><circle cx="360" cy="138" r="14" fill="#ca8440" stroke="#fff" stroke-width="3"/><text x="360" y="111" font-size="31" fill="#30483f" font-weight="700" text-anchor="middle">あそこ</text><text x="360" y="185" font-size="23" fill="#657c73" font-weight="500" text-anchor="middle">di sana</text><text x="360" y="451" font-size="25" fill="#30483f" font-weight="700" text-anchor="middle">Versi sopan untuk menunjuk tempat / arah</text><rect x="24" y="477" width="216" height="85" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="132.0" y="511" font-size="28" fill="#30483f" font-weight="700" text-anchor="middle">こちら</text><text x="132.0" y="544" font-size="22" fill="#657c73" font-weight="500" text-anchor="middle">di sini / arah sini</text><rect x="252" y="477" width="216" height="85" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="360.0" y="511" font-size="28" fill="#30483f" font-weight="700" text-anchor="middle">そちら</text><text x="360.0" y="544" font-size="22" fill="#657c73" font-weight="500" text-anchor="middle">di situ / arah situ</text><rect x="480" y="477" width="216" height="85" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="588.0" y="511" font-size="28" fill="#30483f" font-weight="700" text-anchor="middle">あちら</text><text x="588.0" y="544" font-size="22" fill="#657c73" font-weight="500" text-anchor="middle">di sana / arah sana</text></svg>