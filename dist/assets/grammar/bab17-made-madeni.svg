<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 753" role="img" aria-labelledby="bab17-made-madeni-title bab17-made-madeni-desc"><title id="bab17-made-madeni-title">Sampai kapan atau paling lambat kapan?</title><desc id="bab17-made-madeni-desc">Dua garis waktu dengan batas tegak pada jam lima. Atas まで: bekerja terus sampai lima. Bawah までに: pulang sebelum atau tepat jam lima; titik contoh selesai lebih awal.</desc><defs><marker id="bab17-made-madeni-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}</style><rect x="0" y="0" width="720" height="753" rx="24" fill="#f0f6f3" stroke="none" stroke-width="3"/><text x="360" y="48" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">Sampai kapan atau paling lambat kapan?</text><rect x="24" y="88" width="672" height="270" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="360" y="131" font-size="34" fill="#8a6caf" font-weight="700" text-anchor="middle">〜まで</text><text x="360" y="169" font-size="25" fill="#657c73" font-weight="500" text-anchor="middle">berlangsung terus sampai batas</text><path d="M88 248L637 248" fill="none" stroke="#c8d7cf" stroke-width="5" stroke-linecap="round" marker-end="url(#bab17-made-madeni-arrow)"/><path d="M565 197L565 278" fill="none" stroke="#ca8440" stroke-width="5" stroke-linecap="round"/><text x="565" y="307" font-size="24" fill="#ca8440" font-weight="500" text-anchor="middle">5じ · jam 5</text><path d="M88 248L560 248" fill="none" stroke="#8a6caf" stroke-width="10" stroke-linecap="round"/><text x="360" y="343" font-size="28" fill="#30483f" font-weight="500" text-anchor="middle">5じまで はたらきます。</text><rect x="24" y="381" width="672" height="270" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="360" y="424" font-size="34" fill="#438a78" font-weight="700" text-anchor="middle">〜までに</text><text x="360" y="462" font-size="25" fill="#657c73" font-weight="500" text-anchor="middle">selesai paling lambat pada batas</text><path d="M88 541L637 541" fill="none" stroke="#c8d7cf" stroke-width="5" stroke-linecap="round" marker-end="url(#bab17-made-madeni-arrow)"/><path d="M565 490L565 571" fill="none" stroke="#ca8440" stroke-width="5" stroke-linecap="round"/><text x="565" y="600" font-size="24" fill="#ca8440" font-weight="500" text-anchor="middle">5じ · jam 5</text><circle cx="350" cy="541" r="15" fill="#438a78" stroke="#fff" stroke-width="3"/><text x="350" y="519" font-size="23" fill="#438a78" font-weight="500" text-anchor="middle">selesai</text><path d="M375 541L546 541" fill="none" stroke="#438a78" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 9"/><text x="360" y="636" font-size="28" fill="#30483f" font-weight="500" text-anchor="middle">5じまでに かえります。</text><text x="360" y="690" font-size="24" fill="#657c73" font-weight="500" text-anchor="middle">Ungu: kegiatan terus berjalan. Hijau: sudah selesai.</text><text x="360" y="724" font-size="23" fill="#657c73" font-weight="500" text-anchor="middle">〜までに juga boleh tepat pada batas akhirnya.</text></svg>