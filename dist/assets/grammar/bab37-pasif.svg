<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 864" role="img" aria-labelledby="bab37-pasif-title bab37-pasif-desc"><title id="bab37-pasif-title">Peristiwa sama, sudut pandang berbeda</title><desc id="bab37-pasif-desc">Dua baris aktif dan pasif dengan panah guru ke saya yang sama. Aktif lengkap: guru memuji saya. Pasif lengkap: saya dipuji oleh guru. Pada pasif saya disorot sebagai topik; に menandai pelaku.</desc><defs><marker id="bab37-pasif-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}</style><rect x="0" y="0" width="720" height="864" rx="24" fill="#f0f6f3" stroke="none" stroke-width="3"/><text x="360" y="48" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">Peristiwa sama, sudut pandang berbeda</text><rect x="24" y="80" width="672" height="290" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="360" y="119" font-size="23" fill="#8a6caf" font-weight="700" text-anchor="middle">AKTIF</text><text x="360" y="165" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">せんせいが わたしを ほめました</text><g transform="translate(150 264)"><circle cy="-30" r="23" fill="#ffe1bc"/><path d="M-30 40v-28q30-28 60 0v28" fill="#438a78"/><circle cx="-3" cy="-33" r="2.8" fill="#30483f"/><circle cx="11" cy="-33" r="2.8" fill="#30483f"/><path d="M-5 -22q5 5 10 0" fill="none" stroke="#30483f" stroke-width="2"/></g><text x="150" y="334" font-size="24" fill="#30483f" font-weight="500" text-anchor="middle">せんせい</text><g transform="translate(555 264)"><circle cy="-30" r="23" fill="#ffe1bc"/><path d="M-30 40v-28q30-28 60 0v28" fill="#8a6caf"/><circle cx="-11" cy="-33" r="2.8" fill="#30483f"/><circle cx="3" cy="-33" r="2.8" fill="#30483f"/><path d="M-5 -22q5 5 10 0" fill="none" stroke="#30483f" stroke-width="2"/></g><text x="555" y="334" font-size="24" fill="#30483f" font-weight="500" text-anchor="middle">わたし</text><path d="M219 253L483 253" fill="none" stroke="#438a78" stroke-width="8" stroke-linecap="round" marker-end="url(#bab37-pasif-arrow)"/><text x="350" y="233" font-size="23" fill="#657c73" font-weight="500" text-anchor="middle">pujian</text><rect x="24" y="395" width="672" height="290" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="360" y="434" font-size="23" fill="#8a6caf" font-weight="700" text-anchor="middle">PASIF</text><text x="360" y="480" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">わたしは せんせいに ほめられました</text><rect x="480" y="514" width="151" height="151" rx="20" fill="#ede3fa" stroke="#8a6caf" stroke-width="3"/><g transform="translate(150 579)"><circle cy="-30" r="23" fill="#ffe1bc"/><path d="M-30 40v-28q30-28 60 0v28" fill="#438a78"/><circle cx="-3" cy="-33" r="2.8" fill="#30483f"/><circle cx="11" cy="-33" r="2.8" fill="#30483f"/><path d="M-5 -22q5 5 10 0" fill="none" stroke="#30483f" stroke-width="2"/></g><text x="150" y="649" font-size="24" fill="#30483f" font-weight="500" text-anchor="middle">せんせい</text><g transform="translate(555 579)"><circle cy="-30" r="23" fill="#ffe1bc"/><path d="M-30 40v-28q30-28 60 0v28" fill="#8a6caf"/><circle cx="-11" cy="-33" r="2.8" fill="#30483f"/><circle cx="3" cy="-33" r="2.8" fill="#30483f"/><path d="M-5 -22q5 5 10 0" fill="none" stroke="#30483f" stroke-width="2"/></g><text x="555" y="649" font-size="24" fill="#30483f" font-weight="500" text-anchor="middle">わたし</text><path d="M219 568L483 568" fill="none" stroke="#438a78" stroke-width="8" stroke-linecap="round" marker-end="url(#bab37-pasif-arrow)"/><text x="350" y="548" font-size="23" fill="#657c73" font-weight="500" text-anchor="middle">pujian</text><text x="360" y="755" font-size="27" fill="#30483f" font-weight="700" text-anchor="middle">に = pelaku (せんせいに)</text><text x="360" y="796" font-size="26" fill="#30483f" font-weight="500" text-anchor="middle">Yang dikenai menjadi topik: わたしは</text><text x="360" y="834" font-size="24" fill="#657c73" font-weight="500" text-anchor="middle">Arah pujiannya tetap sama: guru → saya.</text></svg>