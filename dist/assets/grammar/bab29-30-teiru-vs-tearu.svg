<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 894" role="img" aria-labelledby="bab29-30-teiru-vs-tearu-title bab29-30-teiru-vs-tearu-desc"><title id="bab29-30-teiru-vs-tearu-title">Jendela sama, fokus kalimat berbeda</title><desc id="bab29-30-teiru-vs-tearu-desc">Dua panel berdampingan dengan jendela yang sama, kusen dan kaca tipis, sama-sama terbuka. Kiri tanda tanya dan まどが あいています; kanan ikon orang dan まどが あけて あります. Pasangan あく／あける dan われる／わる.</desc><defs><marker id="bab29-30-teiru-vs-tearu-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}</style><rect x="0" y="0" width="720" height="894" rx="24" fill="#f0f6f3" stroke="none" stroke-width="3"/><text x="360" y="48" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">Jendela sama, fokus kalimat berbeda</text><rect x="24" y="80" width="330" height="450" rx="18" fill="#fff" stroke="none" stroke-width="3"/><rect x="366" y="80" width="330" height="450" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="189" y="123" font-size="26" fill="#8a6caf" font-weight="700" text-anchor="middle">Keadaan terlihat</text><text x="531" y="123" font-size="26" fill="#438a78" font-weight="700" text-anchor="middle">Ada tujuan / persiapan</text><rect x="89" y="170" width="200" height="150" rx="3" fill="#d8edf3" stroke="#77a2b1" stroke-width="3"/><rect x="101" y="182" width="176" height="126" rx="0" fill="#f5fbfc" stroke="none" stroke-width="3"/><path d="M189 174L189 316" fill="none" stroke="#77a2b1" stroke-width="4" stroke-linecap="round"/><path d="M102 183l48 22v84l-48 18z M276 183l-48 22v84l48 18z" fill="#d6edf3" fill-opacity=".65" stroke="#77a2b1" stroke-width="3"/><path d="M81 325L297 325" fill="none" stroke="#aabeb5" stroke-width="6" stroke-linecap="round"/><rect x="431" y="170" width="200" height="150" rx="3" fill="#d8edf3" stroke="#77a2b1" stroke-width="3"/><rect x="443" y="182" width="176" height="126" rx="0" fill="#f5fbfc" stroke="none" stroke-width="3"/><path d="M531 174L531 316" fill="none" stroke="#77a2b1" stroke-width="4" stroke-linecap="round"/><path d="M444 183l48 22v84l-48 18z M618 183l-48 22v84l48 18z" fill="#d6edf3" fill-opacity=".65" stroke="#77a2b1" stroke-width="3"/><path d="M423 325L639 325" fill="none" stroke="#aabeb5" stroke-width="6" stroke-linecap="round"/><text x="308" y="182" font-size="36" fill="#8a6caf" font-weight="700" text-anchor="middle">?</text><g transform="translate(659 296)"><circle cy="-30" r="23" fill="#ffe1bc"/><path d="M-30 40v-28q30-28 60 0v28" fill="#438a78"/><circle cx="-11" cy="-33" r="2.8" fill="#30483f"/><circle cx="3" cy="-33" r="2.8" fill="#30483f"/><path d="M-5 -22q5 5 10 0" fill="none" stroke="#30483f" stroke-width="2"/></g><text x="189" y="380" font-size="29" fill="#30483f" font-weight="500" text-anchor="middle">まどが</text><text x="189" y="419" font-size="30" fill="#8a6caf" font-weight="700" text-anchor="middle">あいています</text><text x="531" y="380" font-size="29" fill="#30483f" font-weight="500" text-anchor="middle">まどが</text><text x="531" y="419" font-size="29" fill="#438a78" font-weight="700" text-anchor="middle">あけて あります</text><text x="189" y="459" font-size="22" fill="#30483f" font-weight="500" text-anchor="middle">Jendela terbuka.</text><text x="189" y="486" font-size="22" fill="#30483f" font-weight="500" text-anchor="middle">Tidak tahu siapa yang</text><text x="189" y="513" font-size="22" fill="#30483f" font-weight="500" text-anchor="middle">membukanya.</text><text x="531" y="459" font-size="22" fill="#30483f" font-weight="500" text-anchor="middle">Ada yang sengaja membuka</text><text x="531" y="486" font-size="22" fill="#30483f" font-weight="500" text-anchor="middle">jendela (misalnya</text><text x="531" y="513" font-size="22" fill="#30483f" font-weight="500" text-anchor="middle">untuk ventilasi).</text><rect x="24" y="551" width="672" height="155" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="360" y="592" font-size="26" fill="#8a6caf" font-weight="700" text-anchor="middle">〜ています = keadaan hasil,</text><text x="360" y="625" font-size="25" fill="#30483f" font-weight="500" text-anchor="middle">penyebab tidak disebut.</text><text x="360" y="670" font-size="25" fill="#438a78" font-weight="700" text-anchor="middle">〜てあります = hasil perbuatan disengaja.</text><text x="360" y="751" font-size="25" fill="#30483f" font-weight="500" text-anchor="middle">Pasangan kata: あく (terbuka) ↔ あける (membuka)</text><text x="360" y="789" font-size="25" fill="#30483f" font-weight="500" text-anchor="middle">Contoh lain: われる (pecah) ↔ わる (memecahkan)</text><text x="360" y="833" font-size="23" fill="#657c73" font-weight="500" text-anchor="middle">あく／われる tidak menyebut pelaku;</text><text x="360" y="864" font-size="23" fill="#657c73" font-weight="500" text-anchor="middle">bukan berarti selalu terjadi dengan sendirinya.</text></svg>