<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1025" role="img" aria-labelledby="bab24-memberi-menerima-title bab24-memberi-menerima-desc"><title id="bab24-memberi-menerima-title">Memberi atau menerima: lihat arahnya</title><desc id="bab24-memberi-menerima-desc">Tiga panel dengan saya, A dan B. あげます saya ke A; くれます A ke saya atau keluarga saya; もらいます saya menerima dari A. Penerima disorot pada panel ketiga. Bab 7 dan 24.</desc><defs><marker id="bab24-memberi-menerima-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}</style><rect x="0" y="0" width="720" height="1025" rx="24" fill="#f0f6f3" stroke="none" stroke-width="3"/><text x="360" y="48" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">Memberi atau menerima: lihat arahnya</text><rect x="24" y="80" width="672" height="270" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="360" y="124" font-size="33" fill="#8a6caf" font-weight="700" text-anchor="middle">あげます</text><g transform="translate(130 210)"><circle cy="-30" r="23" fill="#ffe1bc"/><path d="M-30 40v-28q30-28 60 0v28" fill="#8a6caf"/><circle cx="-3" cy="-33" r="2.8" fill="#30483f"/><circle cx="11" cy="-33" r="2.8" fill="#30483f"/><path d="M-5 -22q5 5 10 0" fill="none" stroke="#30483f" stroke-width="2"/></g><text x="130" y="280" font-size="24" fill="#30483f" font-weight="500" text-anchor="middle">私 · saya</text><g transform="translate(505 210)"><circle cy="-30" r="23" fill="#ffe1bc"/><path d="M-30 40v-28q30-28 60 0v28" fill="#438a78"/><circle cx="-11" cy="-33" r="2.8" fill="#30483f"/><circle cx="3" cy="-33" r="2.8" fill="#30483f"/><path d="M-5 -22q5 5 10 0" fill="none" stroke="#30483f" stroke-width="2"/></g><text x="505" y="280" font-size="24" fill="#30483f" font-weight="500" text-anchor="middle">A</text><g transf