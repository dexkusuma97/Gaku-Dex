<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 857" role="img" aria-labelledby="bab49-50-hormat-merendah-title bab49-50-hormat-merendah-desc"><title id="bab49-50-hormat-merendah-title">Hormat kepada orang lain, rendah untuk diri</title><desc id="bab49-50-hormat-merendah-desc">Dua tangga berdampingan. Kiri tamu atau atasan di anak tangga atas dengan いらっしゃいます. Kanan saya di anak tangga bawah dengan まいります. Di bawah setiap tangga pola umum お V-ます(stem)になります dan お V-ます(stem)します, terpisah dari kata kerja khusus.</desc><defs><marker id="bab49-50-hormat-merendah-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}</style><rect x="0" y="0" width="720" height="857" rx="24" fill="#f0f6f3" stroke="none" stroke-width="3"/><text x="360" y="48" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">Hormat kepada orang lain, rendah untuk diri</text><rect x="24" y="80" width="330" height="565" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="189" y="124" font-size="28" fill="#30483f" font-weight="700" text-anchor="middle">Bab 49 · hormat</text><path d="M54 390h80v-70h80v-70h100" fill="none" stroke="#c5b3de" stroke-width="13" stroke-linejoin="round"/><rect x="366" y="80" width="330" height="565" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="531" y="124" font-size="28" fill="#30483f" font-weight="700" text-anchor="middle">Bab 50 · merendah</text><path d="M396 390h80v-70h80v-70h100" fill="none" stroke="#c5b3de" stroke-width="13" stroke-linejoin="round"/><g transform="translate(260 184)"><circle cy="-30" r="23" fill="#ffe1bc"/><path d="M-30 40v-28q30-28 60 0v28" fill="#438a78"/><circle cx="-7" cy="-33" r="2.8" fill="#30483f"/><circle cx="7" cy="-33" r="2.8" fill="#30483f"/><path d="M-5 -22q5 5 10 0" fill="none" stroke="#30483f" stroke-width="2"/></g><text x="260" y="254" font-size="24" fill="#30483f" font-weight="500" text-anchor="middle">tamu / atasan</text><g transform="translate(437 343)"><circle cy="-30" r="23" fill="#ffe1bc"/><path d="M-30 40v-28q30-28 60 0v28" fill="#8a6caf"/><circle cx="-7" cy="-33" r="2.8" fill="#30483f"/><circle cx="7" cy="-33" r="2.8" fill="#30483f"/><path d="M-5 -22q5 5 10 0" fill="none" stroke="#30483f" stroke-width="2"/></g><text x="437" y="413" font-size="24" fill="#30483f" font-weight="500" text-anchor="middle">saya</text><path d="M73 275L207 183" fill="none" stroke="#438a78" stroke-width="5" stroke-linecap="round" marker-end="url(#bab49-50-hormat-merendah-arrow)"/><path d="M661 290L511 392" fill="none" stroke="#8a6caf" stroke-width="5" stroke-linecap="round" marker-end="url(#bab49-50-hormat-merendah-arrow)"/><text x="189" y="454" font-size="29" fill="#438a78" font-weight="700" text-anchor="middle">いらっしゃいます</text><text x="189" y="493" font-size="24" fill="#657c73" font-weight="500" text-anchor="middle">dia pergi / datang / ada</text><text x="531" y="454" font-size="31" fill="#8a6caf" font-weight="700" text-anchor="middle">まいります</text><text x="531" y="493" font-size="24" fill="#657c73" font-weight="500" text-anchor="middle">saya pergi / datang</text><text x="189" y="546" font-size="22" fill="#657c73" font-weight="500" text-anchor="middle">Pola umum</text><text x="189" y="582" font-size="25" fill="#30483f" font-weight="700" text-anchor="middle">お V-ます(stem)</text><text x="189" y="618" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">になります</text><text x="531" y="546" font-size="22" fill="#657c73" font-weight="500" text-anchor="middle">Pola umum</text><text x="531" y="582" font-size="25" fill="#30483f" font-weight="700" text-anchor="middle">お V-ます(stem)</text><text x="531" y="618" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">します</text><text x="360" y="693" font-size="24" fill="#30483f" font-weight="500" text-anchor="middle">stem = bagian kata kerja setelah ます dilepas.</text><text x="360" y="730" font-size="24" fill="#30483f" font-weight="500" text-anchor="middle">Contoh: よみます → よみ</text><text x="360" y="767" font-size="24" fill="#30483f" font-weight="500" text-anchor="middle">Kata khusus di atas tidak dibentuk dengan rumus ini.</text><text x="360" y="826" font-size="24" fill="#657c73" font-weight="500" text-anchor="middle">Tangga = sikap berbahasa, bukan nilai pribadi.</text></svg>