<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 903" role="img" aria-labelledby="bab46-tokoro-title bab46-tokoro-desc"><title id="bab46-tokoro-title">Sebelum, sedang, dan tepat sesudah</title><desc id="bab46-tokoro-desc">Satu garis waktu tiga titik: るところ baru akan, ているところ sedang, たところ tepat baru selesai, semuanya dengan contoh makan. たばかり terpisah: baru saja menurut perasaan pembicara, bukan titik waktu yang sama.</desc><defs><marker id="bab46-tokoro-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}</style><rect x="0" y="0" width="720" height="903" rx="24" fill="#f0f6f3" stroke="none" stroke-width="3"/><text x="360" y="48" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">Sebelum, sedang, dan tepat sesudah</text><path d="M66 176L655 176" fill="none" stroke="#8a6caf" stroke-width="5" stroke-linecap="round" marker-end="url(#bab46-tokoro-arrow)"/><circle cx="130" cy="176" r="15" fill="#8a6caf" stroke="#fff" stroke-width="3"/><circle cx="360" cy="176" r="15" fill="#ca8440" stroke="#fff" stroke-width="3"/><circle cx="590" cy="176" r="15" fill="#438a78" stroke="#fff" stroke-width="3"/><text x="130" y="128" font-size="25" fill="#30483f" font-weight="500" text-anchor="middle">sebelum</text><text x="360" y="128" font-size="25" fill="#30483f" font-weight="500" text-anchor="middle">sedang</text><text x="590" y="128" font-size="25" fill="#30483f" font-weight="500" text-anchor="middle">setelah</text><rect x="24" y="227" width="672" height="127" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="360" y="262" font-size="28" fill="#30483f" font-weight="700" text-anchor="middle">〜る ところ · baru akan</text><text x="360" y="314" font-size="29" fill="#30483f" font-weight="500" text-anchor="middle">たべる ところです。</text><rect x="24" y="374" width="672" height="127" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="360" y="409" font-size="28" fill="#30483f" font-weight="700" text-anchor="middle">〜ている ところ · sedang</text><text x="360" y="461" font-size="29" fill="#30483f" font-weight="500" text-anchor="middle">たべている ところです。</text><rect x="24" y="521" width="672" height="127" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="360" y="556" font-size="28" fill="#30483f" font-weight="700" text-anchor="middle">〜た ところ · baru saja selesai</text><text x="360" y="608" font-size="29" fill="#30483f" font-weight="500" text-anchor="middle">たべた ところです。</text><rect x="24" y="690" width="672" height="185" rx="18" fill="#fff2df" stroke="none" stroke-width="3"/><text x="360" y="732" font-size="31" fill="#ca8440" font-weight="700" text-anchor="middle">〜た ばかり</text><text x="360" y="775" font-size="25" fill="#30483f" font-weight="500" text-anchor="middle">Baru saja menurut perasaan pembicara.</text><text x="360" y="814" font-size="24" fill="#657c73" font-weight="500" text-anchor="middle">Tidak harus tepat sesaat setelah selesai.</text><text x="360" y="853" font-size="28" fill="#30483f" font-weight="500" text-anchor="middle">にほんに きた ばかりです。</text></svg>