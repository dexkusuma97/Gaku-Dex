<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 831" role="img" aria-labelledby="bab11-satuan-hitung-title bab11-satuan-hitung-desc"><title id="bab11-satuan-hitung-title">Pilih hitungan sesuai bendanya</title><desc id="bab11-satuan-hitung-desc">Hitungan umum ひとつ sampai とお. Empat kelompok ikon: orang にん dengan pengecualian ひとり・ふたり, kertas まい, kendaraan atau mesin だい, apel こ.</desc><defs><marker id="bab11-satuan-hitung-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}</style><rect x="0" y="0" width="720" height="831" rx="24" fill="#f0f6f3" stroke="none" stroke-width="3"/><text x="360" y="48" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">Pilih hitungan sesuai bendanya</text><rect x="24" y="80" width="672" height="150" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="360" y="113" font-size="25" fill="#30483f" font-weight="700" text-anchor="middle">Hitungan umum (1–10)</text><text x="360" y="155" font-size="26" fill="#30483f" font-weight="500" text-anchor="middle">ひとつ　ふたつ　みっつ　よっつ　いつつ</text><text x="360" y="194" font-size="26" fill="#30483f" font-weight="500" text-anchor="middle">むっつ　ななつ　やっつ　ここのつ　とお</text><rect x="24" y="254" width="330" height="264" rx="18" fill="#fff" stroke="none" stroke-width="3"/><g transform="translate(124 339)"><circle cy="-30" r="23" fill="#ffe1bc"/><path d="M-30 40v-28q30-28 60 0v28" fill="#8a6caf"/><circle cx="-7" cy="-33" r="2.8" fill="#30483f"/><circle cx="7" cy="-33" r="2.8" fill="#30483f"/><path d="M-5 -22q5 5 10 0" fill="none" stroke="#30483f" stroke-width="2"/></g><g transform="translate(189 339)"><circle cy="-30" r="23" fill="#ffe1bc"/><path d="M-30 40v-28q30-28 60 0v28" fill="#8a6caf"/><circle cx="-7" cy="-33" r="2.8" fill="#30483f"/><circle cx="7" cy="-33" r="2.8" fill="#30483f"/><path