<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 830" role="img" aria-labelledby="bab48-kausatif-title bab48-kausatif-desc"><title id="bab48-kausatif-title">Menyuruh pergi dan meminta izin</title><desc id="bab48-kausatif-desc">Atasan kiri menunjuk bawahan kanan; panah menyuruh dari atasan ke bawahan. Miller melakukan aksi pergi ke Osaka. Gelembung permintaan izin berasal dari Miller, yang juga menjadi pelaku pergi.</desc><defs><marker id="bab48-kausatif-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}</style><rect x="0" y="0" width="720" height="830" rx="24" fill="#f0f6f3" stroke="none" stroke-width="3"/><text x="360" y="48" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">Menyuruh pergi dan meminta izin</text><g transform="translate(123 190)"><circle cy="-30" r="23" fill="#ffe1bc"/><path d="M-30 40v-28q30-28 60 0v28" fill="#438a78"/><circle cx="-2" cy="-33" r="2.8" fill="#30483f"/><circle cx="12" cy="-33" r="2.8" fill="#30483f"/><path d="M-5 -22q5 5 10 0" fill="none" stroke="#30483f" stroke-width="2"/></g><text x="123" y="260" font-size="24" fill="#30483f" font-weight="500" text-anchor="middle">ぶちょう · atasan</text><g transform="translate(560 190)"><circle cy="-30" r="23" fill="#ffe1bc"/><path d="M-30 40v-28q30-28 60 0v28" fill="#8a6caf"/><circle cx="-12" cy="-33" r="2.8" fill="#30483f"/><circle cx="2" cy="-33" r="2.8" fill="#30483f"/><path d="M-5 -22q5 5 10 0" fill="none" stroke="#30483f" stroke-width="2"/></g><text x="560" y="260" font-size="24" fill="#30483f" font-weight="500" text-anchor="middle">ミラーさん</text><path d="M153 204L206 167" fill="none" stroke="#438a78" stroke-width="10" stroke-linecap="round"/><path d="M215 175L487 175" fill="none" stroke="#ca8440" stroke-width="8" stroke-linecap="round" marker-end="url(#bab48-kausatif-arrow)"/><text x="360" y="129" font-size="32" fill="#ca8440" font-weight="700" text-anchor="middle">いかせます</text><path d="M590 206L653 206" fill="none" stroke="#8a6caf" stroke-width="5" stroke-linecap="round" marker-end="url(#bab48-kausatif-arrow)"/><text x="631" y="184" font-size="23" fill="#657c73" font-weight="500" text-anchor="middle">pergi</text><rect x="599" y="288" width="80" height="65" rx="6" fill="#e4d6f2" stroke="none" stroke-width="3"/><text x="639" y="329" font-size="25" fill="#30483f" font-weight="500" text-anchor="middle">大阪</text><rect x="24" y="386" width="672" height="120" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="360" y="430" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">ぶちょうは ミラーさんを</text><text x="360" y="470" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">おおさかへ いかせました。</text><text x="360" y="547" font-size="25" fill="#657c73" font-weight="500" text-anchor="middle">Atasan menyuruh Miller pergi ke Osaka.</text><rect x="24" y="581" width="672" height="220" rx="18" fill="#fff2df" stroke="none" stroke-width="3"/><path d="M550 581l22-36 12 36z" fill="#fff2df"/><text x="360" y="629" font-size="32" fill="#ca8440" font-weight="700" text-anchor="middle">いかせて ください</text><text x="360" y="673" font-size="26" fill="#30483f" font-weight="500" text-anchor="middle">“Mohon izinkan saya pergi.”</text><text x="360" y="717" font-size="25" fill="#30483f" font-weight="500" text-anchor="middle">Yang berbicara = yang akan pergi.</text><text x="360" y="761" font-size="24" fill="#657c73" font-weight="500" text-anchor="middle">Di sini Miller meminta izin kepada atasan.</text></svg>