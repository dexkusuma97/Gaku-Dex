<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 605" role="img" aria-labelledby="bab18-34-mae-ato-title bab18-34-mae-ato-desc"><title id="bab18-34-mae-ato-title">Sebelum dan sesudah kejadian</title><desc id="bab18-34-mae-ato-desc">Satu garis waktu dengan titik kejadian di tengah, まえに di kiri dan あとで di kanan. Contoh sebelum tidur membaca buku, setelah bekerja pergi minum. Dipakai Bab 18 dan 34.</desc><defs><marker id="bab18-34-mae-ato-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}</style><rect x="0" y="0" width="720" height="605" rx="24" fill="#f0f6f3" stroke="none" stroke-width="3"/><text x="360" y="48" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">Sebelum dan sesudah kejadian</text><path d="M70 207L650 207" fill="none" stroke="#8a6caf" stroke-width="5" stroke-linecap="round" marker-end="url(#bab18-34-mae-ato-arrow)"/><circle cx="360" cy="207" r="16" fill="#ca8440" stroke="#fff" stroke-width="3"/><text x="360" y="168" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">kejadian</text><text x="180" y="254" font-size="24" fill="#657c73" font-weight="500" text-anchor="middle">sebelum</text><text x="540" y="254" font-size="24" fill="#657c73" font-weight="500" text-anchor="middle">setelah</text><rect x="24" y="290" width="330" height="85" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="189.0" y="324" font-size="28" fill="#30483f" font-weight="700" text-anchor="middle">〜まえに</text><text x="189.0" y="357" font-size="22" fill="#657c73" font-weight="500" text-anchor="middle">sebelum kejadian</text><rect x="366" y="290" width="330" height="85" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="531.0" y="324" font-size="28" fill="#30483f" font-weight="700" text-anchor="middle">〜あとで</text><text x="531.0" y="357" font-size="22" fill="#657c73" font-weight="500" text-anchor="middle">setelah kejadian</text><rect x="24" y="400" width="672" height="175" rx="18" fill="#fff" stroke="none" stroke-width="3"/><text x="360" y="442" font-size="29" fill="#30483f" font-weight="700" text-anchor="middle">ねるまえに ほんを よみます。</text><text x="360" y="478" font-size="24" fill="#657c73" font-weight="500" text-anchor="middle">Sebelum tidur, saya membaca buku.</text><text x="360" y="523" font-size="28" fill="#30483f" font-weight="700" text-anchor="middle">しごとの あとで のみに いきます。</text><text x="360" y="559" font-size="24" fill="#657c73" font-weight="500" text-anchor="middle">Setelah bekerja, saya pergi minum.</text></svg>